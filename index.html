function readStoredValue(key, uid) {

function getCategories() {
  return BASE_CATEGORIES.map((cat, i) => {
    const deleted = new Set(state.deletedBaseDrinks[i] || []);
    const overrides = state.baseOverrides[i] || {};
    const baseDrinks = cat.drinks
      .filter(d => !deleted.has(d.name))
      .map(d => {
        const ov = overrides[d.name];
        return { ...(ov || d), _isBase: true, _baseKey: d.name };
      });
    const baseNames = new Set(baseDrinks.map(d => d.name));
    // If a drink was added by hand before it later became a default (same
    // name), don't show it twice — the default one wins, the leftover
    // custom copy just stays unused in storage instead of duplicating.
    const customDrinks = (state.customDrinks[i] || [])
      .filter(d => !baseNames.has(d.name))
      .map(d => ({ ...d, _isBase: false, _baseKey: null }));
    return { ...cat, drinks: [...baseDrinks, ...customDrinks] };
  });
}

function getTotals() {
  const map = {};
  for (const item of state.order) {

      let display = name;
      if (name === "Milk" && item.milk) display = MILK_TO_MATERIAL[item.milk] || (item.milk + " Milk");

}

function saveDrink() {
  const st = state.editorState; const ci = state.editingDrink.catIndex;
  const isBase = state.editingDrink.isBase; const baseKey = state.editingDrink.baseKey;
  const orig = state.editingDrink.drink?.name || null;
  const name = st.name.trim(); if (!name) return alert("Drink name is required");
  const cleanSizes = {};
  for (const sz of st.sizes) {
    const sn = sz.name.trim(); if (!sn) return alert("All sizes must have a name");
    if (cleanSizes[sn]) return alert("Duplicate size: " + sn);
    const ings = sz.ingredients.filter(i => i[0].trim()).map(i => [i[0].trim(), Number(i[1])||0, i[2]||"g"]);
    if (!ings.length) return alert("Size " + sn + " needs at least one ingredient");
    cleanSizes[sn] = ings;
  }
  const drink = { name, milk: st.hasMilk, sizes: cleanSizes };
  if (st.note.trim()) drink.note = st.note.trim();

  if (isBase) {
    // Editing one of the built-in drinks: store as an override keyed by its
    // ORIGINAL name so it truly replaces the default instead of duplicating it.
    const newOverrides = { ...(state.baseOverrides[ci] || {}), [baseKey]: drink };
    saveBaseOverrides({ ...state.baseOverrides, [ci]: newOverrides });
  } else {
    const custom = [...(state.customDrinks[ci] || [])];
    if (orig) {
      const idx = custom.findIndex(d => d.name === orig);
      if (idx >= 0) custom[idx] = drink;
    } else {
      const cats = getCategories();
      if (cats[ci].drinks.some(d => d.name === name)) return alert("A drink with this name already exists");
      custom.push(drink);
    }
    saveCustomDrinks({ ...state.customDrinks, [ci]: custom });
  }
  state.editingDrink = null; state.editorState = null; render();
}

function deleteDrink(catIndex, drinkName, isBase, baseKey) {

  if (isBase) {

    // edit override for it so it doesn't linger in storage.
    const deleted = { ...state.deletedBaseDrinks, [catIndex]: [...new Set([...(state.deletedBaseDrinks[catIndex] || []), baseKey])] };
    saveDeletedBaseDrinks(deleted);
    if (state.baseOverrides[catIndex] && state.baseOverrides[catIndex][baseKey]) {
      const newOverrides = { ...state.baseOverrides[catIndex] };
      delete newOverrides[baseKey];
      saveBaseOverrides({ ...state.baseOverrides, [catIndex]: newOverrides });
    }
  } else {
    const custom = (state.customDrinks[catIndex] || []).filter(d => d.name !== drinkName);
    saveCustomDrinks({ ...state.customDrinks, [catIndex]: custom });
  }
  render();
}

function addRawMaterial(name, unit) {
  const n = (name || "").trim(); if (!n) return alert("Enter a material name");
  if (state.rawMaterials.some(m => m.name.toLowerCase() === n.toLowerCase())) return alert("This material already exists");
  saveRawMaterials([...state.rawMaterials, { name: n, unit: unit === "ml" ? "ml" : "g" }]);
  render();
}

function renameRawMaterial(index, newName) {
  const n = (newName || "").trim(); if (!n) return;
  const oldName = state.rawMaterials[index].name;
  if (oldName === n) return;
  if (state.rawMaterials.some((m, i) => i !== index && m.name.toLowerCase() === n.toLowerCase())) {
    alert('"' + n + '" already exists in the raw materials list.');
    render();
    return;
  }
  const list = [...state.rawMaterials]; list[index] = { ...list[index], name: n }; saveRawMaterials(list);
  cascadeRenameIngredient(oldName, n);
  render();
}

// Renaming a raw material must actually update every drink recipe that used
// the old name — otherwise the drinks silently keep the stale name forever.
function cascadeRenameIngredient(oldName, newName) {
  const renameInSizes = (sizes) => {
    let changed = false;
    const next = {};
    for (const [sizeName, ings] of Object.entries(sizes)) {
      next[sizeName] = ings.map(([n, amt, unit]) => {
        if (n === oldName) { changed = true; return [newName, amt, unit]; }
        return [n, amt, unit];
      });
    }
    return { sizes: next, changed };
  };

  // 1) Drinks the admin added from scratch
  let anyCustomChanged = false;
  const nextCustom = { ...state.customDrinks };
  for (const [ci, drinks] of Object.entries(nextCustom)) {
    let catChanged = false;
    const updated = drinks.map(d => {
      const { sizes, changed } = renameInSizes(d.sizes);
      if (changed) catChanged = true;
      return changed ? { ...d, sizes } : d;
    });
    if (catChanged) { nextCustom[ci] = updated; anyCustomChanged = true; }
  }
  if (anyCustomChanged) saveCustomDrinks(nextCustom);

  // 2) Default drinks that already have an edit override
  let anyOverrideChanged = false;
  const nextOverrides = { ...state.baseOverrides };
  for (const [ci, overrides] of Object.entries(nextOverrides)) {
    let catChanged = false;
    const updated = { ...overrides };
    for (const [origName, d] of Object.entries(overrides)) {
      const { sizes, changed } = renameInSizes(d.sizes);
      if (changed) { updated[origName] = { ...d, sizes }; catChanged = true; }
    }
    if (catChanged) { nextOverrides[ci] = updated; anyOverrideChanged = true; }
  }

  // 3) Default drinks that still use the factory recipe untouched — create
  // an override for them too, so the rename sticks for these as well.
  BASE_CATEGORIES.forEach((cat, ci) => {
    const already = nextOverrides[ci] || {};
    for (const d of cat.drinks) {
      if (already[d.name]) continue; // handled in step 2
      const { sizes, changed } = renameInSizes(d.sizes);
      if (changed) {
        nextOverrides[ci] = { ...(nextOverrides[ci] || {}), [d.name]: { ...d, sizes } };
        anyOverrideChanged = true;
      }
    }
  });
  if (anyOverrideChanged) saveBaseOverrides(nextOverrides);

  // 4) The milk-type name mapping ("Oat" -> "BFC- Oat Milk", etc.)
  let milkChanged = false;
  const nextMilkMap = { ...MILK_TO_MATERIAL };
  for (const [milkType, materialName] of Object.entries(nextMilkMap)) {
    if (materialName === oldName) { nextMilkMap[milkType] = newName; milkChanged = true; }
  }
  if (milkChanged) saveMilkMaterialMap(nextMilkMap);
}

// ===== ADMIN DATA EXPORT / IMPORT =====
// Exports raw materials + every admin customization (added drinks, edited
// default drinks, removed default drinks) as one JSON file. Categories are
// keyed by their visible label, not internal index, so the file stays
// readable and editable by hand.
function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    rawMaterials: state.rawMaterials,
    customDrinks: {},
    deletedBaseDrinks: {},
    baseOverrides: {},
  };
  BASE_CATEGORIES.forEach((cat, i) => {
    if ((state.customDrinks[i] || []).length) data.customDrinks[cat.label] = state.customDrinks[i];
    if ((state.deletedBaseDrinks[i] || []).length) data.deletedBaseDrinks[cat.label] = state.deletedBaseDrinks[i];
    if (state.baseOverrides[i] && Object.keys(state.baseOverrides[i]).length) data.baseOverrides[cat.label] = state.baseOverrides[i];
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `breadfast-coffee-data-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); } catch { return alert("This isn't a valid JSON file."); }
    if (!data || typeof data !== "object") return alert("This file doesn't contain valid data.");

    if (!confirm("Import this file? Raw materials, added drinks, edits and removals it mentions will be applied. Anything not mentioned in the file stays as it is.")) return;

    const findCatIndex = label => BASE_CATEGORIES.findIndex(c => c.label === label);
    const skippedLabels = new Set();

    if (Array.isArray(data.rawMaterials)) {
      const existingNames = new Set();
      const merged = [];
      for (const m of data.rawMaterials) {
        if (!m || !m.name) continue;
        const unit = ["g", "ml", "pcs"].includes(m.unit) ? m.unit : "g";
        if (!existingNames.has(m.name)) { existingNames.add(m.name); merged.push({ name: m.name, unit }); }
      }
      for (const m of state.rawMaterials) {
        if (!existingNames.has(m.name)) { existingNames.add(m.name); merged.push(m); }
      }
      saveRawMaterials(merged);
    }

    if (data.customDrinks && typeof data.customDrinks === "object") {
      const next = { ...state.customDrinks };
      for (const [label, drinks] of Object.entries(data.customDrinks)) {
        const ci = findCatIndex(label);
        if (ci < 0 || !Array.isArray(drinks)) { skippedLabels.add(label); continue; }
        next[ci] = drinks;
      }
      saveCustomDrinks(next);
    }

    if (data.deletedBaseDrinks && typeof data.deletedBaseDrinks === "object") {
      const next = { ...state.deletedBaseDrinks };
      for (const [label, names] of Object.entries(data.deletedBaseDrinks)) {
        const ci = findCatIndex(label);
        if (ci < 0 || !Array.isArray(names)) { skippedLabels.add(label); continue; }
        next[ci] = names;
      }
      saveDeletedBaseDrinks(next);
    }

    if (data.baseOverrides && typeof data.baseOverrides === "object") {
      const next = { ...state.baseOverrides };
      for (const [label, overrides] of Object.entries(data.baseOverrides)) {
        const ci = findCatIndex(label);
        if (ci < 0 || typeof overrides !== "object") { skippedLabels.add(label); continue; }
        next[ci] = overrides;
      }
      saveBaseOverrides(next);
    }

    render();
    alert(skippedLabels.size
      ? "Imported, but these category names weren't recognized and were skipped: " + [...skippedLabels].join(", ")
      : "Import complete.");
  };
  reader.readAsText(file);
}

  const st = state.orderEditorState; const id = state.editingOrderItem.id;
  const name = st.name.trim(); if (!name) return alert("Name is required");
  const size = st.size.trim(); if (!size) return alert("Size is required");
  const ings = st.ingredients.filter(i => i[0].trim()).map(i => [i[0].trim(), Number(i[1])||0, i[2]||"g"]);
  if (!ings.length) return alert("At least one ingredient is required");
  saveOrder(state.order.map(x => x.id === id ? { ...x, name, size, milk: st.hasMilk ? (st.milk.trim()||null) : null, recipe: ings, note: st.note.trim()||undefined } : x));
  state.editingOrderItem = null; state.orderEditorState = null; render();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function renderAuthScreen() {
  const isRegistering = state.authMode === "register";
  const error = state.authError || state.authSetupError;
  return `
    <main class="auth-screen">

            <label for="authEmail">Email address</label>
            <input id="authEmail" name="email" type="email" autocomplete="email" required value="${escapeHtml(state.authEmail)}" oninput="setAuthEmail(this.value)" />
          </div>
          <div class="auth-field">

          </div>

            <div class="auth-field">
              <label for="authConfirmPassword">Confirm password</label>

            </div>
          ` : `

          `}

        ${state.authNotice ? `<p class="auth-message notice" role="status">${escapeHtml(state.authNotice)}</p>` : ""}
        <button class="auth-switch" type="button" onclick="toggleAuthMode()">
          ${isRegistering ? "Already have an account? Sign in" : "New here? Create an account"}
        </button>
        ${state.authSetupError ? `<p class="auth-config-help">Firebase isn't configured yet. Add your Firebase Web App settings to <code>firebase-config.js</code>, then enable Email/Password sign-in in Firebase Authentication.</p>` : ""}

function renderAccountLoading() {
  if (state.accountLoadError) {
    return `
      <main class="auth-screen">
        <section class="auth-card">
          <div class="auth-brand">${ICONS.coffee}<span>Breadfast Coffee</span></div>
          <h1 class="auth-title">Couldn't load your account data</h1>
          <p class="auth-message error" role="alert">${escapeHtml(state.accountLoadError)}</p>
          <div class="auth-form">
            <button class="auth-submit" onclick="retryAccountLoad()">Try again</button>
            <button class="btn-cancel" onclick="signOutAccount()">Sign out</button>
          </div>
        </section>
      </main>
    `;
  }
  return `<main class="auth-screen"><p class="auth-loading">Loading your account data...</p></main>`;

function setAuthEmail(value) {
  state.authEmail = value;
}

function toggleAuthMode() {
  state.authMode = state.authMode === "login" ? "register" : "login";
  state.authError = "";
  state.authNotice = "";
  render();
}

function getAuthErrorMessage(error) {
  const messages = {
    "auth/email-already-in-use": "An account with this email already exists. Sign in instead.",
    "auth/invalid-email": "Enter a valid email address.",
    "auth/invalid-credential": "The email or password is incorrect.",
    "auth/user-not-found": "No account was found for this email.",
    "auth/wrong-password": "The password is incorrect.",
    "auth/weak-password": "Choose a password with at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a little and try again.",
    "auth/network-request-failed": "Can't reach Firebase. Check your internet connection and try again.",
    "auth/operation-not-allowed": "Email/Password sign-in isn't enabled in Firebase Authentication yet.",
    "permission-denied": "Firebase blocked access to your account data. Check that the Firestore rules are deployed."
  };
  return messages[error?.code] || error?.message || "Something went wrong. Please try again.";
}

async function submitAuthForm(event) {
  event.preventDefault();
  if (!firebaseAuth) {
    state.authError = state.authSetupError || "Firebase isn't configured.";
    render();
    return;
  }
  const form = event.currentTarget;
  const formData = new FormData(form);
  const email = String(formData.get("email") || "").trim();
  const password = String(formData.get("password") || "");
  const confirmPassword = String(formData.get("confirmPassword") || "");
  if (state.authMode === "register" && password !== confirmPassword) {
    state.authError = "The passwords don't match.";
    render();
    return;
  }
  state.authEmail = email;
  state.authError = "";
  state.authNotice = "";
  state.authBusy = true;
  render();
  try {
    if (state.authMode === "register") {
      await firebaseAuth.createUserWithEmailAndPassword(email, password);
    } else {
      await firebaseAuth.signInWithEmailAndPassword(email, password);
    }
  } catch (error) {
    console.error("Firebase sign-in failed.", error);
    state.authError = getAuthErrorMessage(error);
  } finally {
    state.authBusy = false;
    render();
  }
}

async function sendPasswordReset() {
  if (!firebaseAuth) {
    state.authError = state.authSetupError || "Firebase isn't configured.";
    render();
    return;
  }
  const email = state.authEmail.trim();
  if (!email) {
    state.authError = "Enter your email address first.";
    state.authNotice = "";
    render();
    return;
  }
  state.authBusy = true;
  state.authError = "";
  state.authNotice = "";
  render();
  try {
    await firebaseAuth.sendPasswordResetEmail(email);
    state.authNotice = "Password reset link sent. Check your email.";
  } catch (error) {
    console.error("Firebase password reset failed.", error);
    state.authError = getAuthErrorMessage(error);
  } finally {
    state.authBusy = false;
    render();
  }
}

function accountDocument(user = state.authUser) {
  if (!user || !firebaseDb) throw new Error("Firebase account data isn't available.");
  return firebaseDb.collection("users").doc(user.uid).collection("appData").doc(ACCOUNT_DOCUMENT_NAME);
}

function serializeAccountData() {
  return {
    schemaVersion: 1,
    ordersByUser: state.ordersByUser,
    currentUser: state.currentUser,
    customDrinks: state.customDrinks,
    deletedBaseDrinks: state.deletedBaseDrinks,
    baseOverrides: state.baseOverrides,
    rawMaterials: state.rawMaterials,
    milkMaterialMap: MILK_TO_MATERIAL
  };
}

function cacheAccountData(data, uid = state.authUser?.uid) {
  return writeStoredValue(ACCOUNT_CACHE_KEY, JSON.stringify(data), uid);
}

function applyAccountData(data, uid = state.authUser?.uid) {
  const source = data && typeof data === "object" ? data : {};
  const orders = source.ordersByUser && typeof source.ordersByUser === "object" ? source.ordersByUser : {};
  state.ordersByUser = Object.fromEntries(USERS.map(user => [user, Array.isArray(orders[user]) ? orders[user] : []]));
  state.currentUser = USERS.includes(source.currentUser) ? source.currentUser : USERS[0];
  state.order = state.ordersByUser[state.currentUser];
  state.customDrinks = source.customDrinks && typeof source.customDrinks === "object" ? source.customDrinks : {};
  state.deletedBaseDrinks = source.deletedBaseDrinks && typeof source.deletedBaseDrinks === "object" ? source.deletedBaseDrinks : {};
  state.baseOverrides = source.baseOverrides && typeof source.baseOverrides === "object" ? source.baseOverrides : {};
  state.rawMaterials = Array.isArray(source.rawMaterials) ? source.rawMaterials : deriveDefaultRawMaterials();
  MILK_TO_MATERIAL = source.milkMaterialMap && typeof source.milkMaterialMap === "object"
    ? { ...DEFAULT_MILK_TO_MATERIAL, ...source.milkMaterialMap }
    : { ...DEFAULT_MILK_TO_MATERIAL };
  const serialized = serializeAccountData();
  cacheAccountData(serialized, uid);
  writeStoredValue(ORDERS_BY_USER_KEY, JSON.stringify(state.ordersByUser), uid);
  writeStoredValue(CURRENT_USER_KEY, state.currentUser, uid);
  writeStoredValue(CUSTOM_DRINKS_KEY, JSON.stringify(state.customDrinks), uid);
  writeStoredValue(DELETED_BASE_KEY, JSON.stringify(state.deletedBaseDrinks), uid);
  writeStoredValue(BASE_OVERRIDES_KEY, JSON.stringify(state.baseOverrides), uid);
  writeStoredValue(RAW_MATERIALS_KEY, JSON.stringify(state.rawMaterials), uid);
  writeStoredValue(MILK_MATERIAL_MAP_KEY, JSON.stringify(MILK_TO_MATERIAL), uid);
}

function readCachedAccountData(uid) {
  try {
    const cached = JSON.parse(readStoredValue(ACCOUNT_CACHE_KEY, uid));
    return cached && typeof cached === "object" ? cached : null;
  } catch { return null; }
}

function readLegacyBrowserData() {
  let hasData = false;
  for (const key of [ORDERS_BY_USER_KEY, ORDER_KEY, CUSTOM_DRINKS_KEY, DELETED_BASE_KEY, BASE_OVERRIDES_KEY, RAW_MATERIALS_KEY, MILK_MATERIAL_MAP_KEY]) {
    if (readLegacyStoredValue(key) !== null) { hasData = true; break; }
  }
  if (!hasData) return null;
  let orders = {};
  let legacyOrder = [];
  let customDrinks = {};
  let deletedBaseDrinks = {};
  let baseOverrides = {};
  let rawMaterials = deriveDefaultRawMaterials();
  let milkMaterialMap = { ...DEFAULT_MILK_TO_MATERIAL };
  try { orders = JSON.parse(readLegacyStoredValue(ORDERS_BY_USER_KEY)) || {}; } catch {}
  try { legacyOrder = JSON.parse(readLegacyStoredValue(ORDER_KEY)) || []; } catch {}
  try { customDrinks = JSON.parse(readLegacyStoredValue(CUSTOM_DRINKS_KEY)) || {}; } catch {}
  try { deletedBaseDrinks = JSON.parse(readLegacyStoredValue(DELETED_BASE_KEY)) || {}; } catch {}
  try { baseOverrides = JSON.parse(readLegacyStoredValue(BASE_OVERRIDES_KEY)) || {}; } catch {}
  try {
    const savedMaterials = JSON.parse(readLegacyStoredValue(RAW_MATERIALS_KEY));
    if (Array.isArray(savedMaterials)) rawMaterials = savedMaterials;
  } catch {}
  try {
    const savedMap = JSON.parse(readLegacyStoredValue(MILK_MATERIAL_MAP_KEY));
    if (savedMap && typeof savedMap === "object") milkMaterialMap = { ...milkMaterialMap, ...savedMap };
  } catch {}
  const savedCurrentUser = readLegacyStoredValue(CURRENT_USER_KEY);
  const currentUser = USERS.includes(savedCurrentUser)
    ? savedCurrentUser
    : USERS[0];
  if (!Object.keys(orders).length) orders = { [USERS[0]]: legacyOrder };
  return { ordersByUser: orders, currentUser, customDrinks, deletedBaseDrinks, baseOverrides, rawMaterials, milkMaterialMap };
}

function persistAccountData() {
  if (!state.authUser || !state.accountDataReady) return;
  const user = state.authUser;
  const data = serializeAccountData();
  const cached = cacheAccountData(data, user.uid);
  if (!cached) {
    state.syncStatus = "error";
    state.syncError = "Couldn't save a local backup in this browser.";
    console.error("Couldn't cache account data in this browser.");
  } else {
    state.syncStatus = "syncing";
    state.syncError = "";
  }
  clearTimeout(accountSaveTimer);
  accountSaveTimer = setTimeout(() => {
    accountSaveTimer = null;
    writeAccountData(user, data);
  }, 350);
}

async function writeAccountData(user, data = serializeAccountData()) {
  try {
    await accountDocument(user).set({
      ...data,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (state.authUser?.uid === user.uid) {
      state.syncStatus = "saved";
      state.syncError = "";
      render();
    }
  } catch (error) {
    console.error("Firebase account data sync failed.", error);
    if (state.authUser?.uid === user.uid) {
      state.syncStatus = "error";
      state.syncError = getAuthErrorMessage(error);
      render();
    }
  }
}

async function activateAccount(user) {
  if (accountUnsubscribe) { accountUnsubscribe(); accountUnsubscribe = null; }
  clearTimeout(accountSaveTimer);
  state.authUser = user;
  state.accountDataReady = false;
  state.accountLoadError = "";
  state.syncStatus = "syncing";
  render();
  const cached = readCachedAccountData(user.uid);
  let snapshot;
  try {
    snapshot = await accountDocument(user).get({ source: "server" });
  } catch (error) {
    console.error("Couldn't load this account from Firebase.", error);
    if (!cached) {
      state.accountLoadError = getAuthErrorMessage(error);
      state.syncStatus = "error";
      render();
      return;
    }
    applyAccountData(cached, user.uid);
    state.accountDataReady = true;
    state.syncStatus = "error";
    state.syncError = "Loaded saved data from this browser; Firebase is currently unavailable.";
    render();
    attachAccountListener(user);
    return;
  }

  if (snapshot.exists) {
    applyAccountData(snapshot.data(), user.uid);
  } else if (cached) {
    applyAccountData(cached, user.uid);
  } else {
    const hasMigratedLegacyData = readLegacyStoredValue(LEGACY_MIGRATION_KEY) === "true";
    const legacyData = hasMigratedLegacyData ? null : readLegacyBrowserData();
    if (legacyData) {
      const shouldMigrate = confirm("This browser has data from the previous version. Copy it into " + (user.email || "this account") + "? Only the account you sign into here will receive this one-time import.");
      try { localStorage.setItem(LEGACY_MIGRATION_KEY, "true"); }
      catch (error) { console.error("Couldn't mark legacy data migration as complete.", error); }
      applyAccountData(shouldMigrate ? legacyData : {});
    } else {
      applyAccountData({});
    }
  }
  state.accountDataReady = true;
  state.authError = "";
  state.syncStatus = snapshot.metadata.fromCache ? "error" : "saved";
  state.syncError = snapshot.metadata.fromCache ? "Using saved local data while Firebase reconnects." : "";
  if (!snapshot.exists && state.syncStatus === "saved") persistAccountData();
  render();
  attachAccountListener(user);
}

function attachAccountListener(user) {
  if (accountUnsubscribe) accountUnsubscribe();
  accountUnsubscribe = accountDocument(user).onSnapshot({ includeMetadataChanges: true }, snapshot => {
    if (state.authUser?.uid !== user.uid || !state.accountDataReady) return;
    if (snapshot.metadata.hasPendingWrites) return;
    if (accountSaveTimer) return;
    if (snapshot.exists) applyAccountData(snapshot.data(), user.uid);
    state.syncStatus = snapshot.metadata.fromCache ? "error" : "saved";
    state.syncError = snapshot.metadata.fromCache ? "Using saved local data while Firebase reconnects." : "";
    render();
  }, error => {
    console.error("Firebase account data listener failed.", error);
    if (state.authUser?.uid === user.uid) {
      state.syncStatus = "error";
      state.syncError = getAuthErrorMessage(error);
      render();
    }
  });
}

async function retryAccountLoad() {
  if (!state.authUser) return;
  await activateAccount(state.authUser);
}

async function signOutAccount() {
  if (!firebaseAuth) return;
  const user = state.authUser;
  if (user && state.accountDataReady) {
    clearTimeout(accountSaveTimer);
    accountSaveTimer = null;
    await Promise.race([
      writeAccountData(user),
      new Promise(resolve => setTimeout(resolve, 2000))
    ]);
  }
  if (accountUnsubscribe) { accountUnsubscribe(); accountUnsubscribe = null; }
  try {
    await firebaseAuth.signOut();
    state.authMode = "login";
    state.authError = "";
    state.authNotice = "";
    state.authEmail = "";
    render();
  } catch (error) {
    console.error("Firebase sign-out failed.", error);
    state.authError = getAuthErrorMessage(error);
    render();
  }
}

function initializeFirebase() {
  const config = window.FIREBASE_CONFIG;
  if (!window.firebase) {
    state.authSetupError = "The Firebase SDK couldn't load. Check the internet connection and reload the page.";
    state.authLoading = false;
    render();
    return;
  }
  if (!config || ["apiKey", "authDomain", "projectId", "appId"].some(key => !config[key] || config[key].startsWith("YOUR_"))) {
    state.authSetupError = "Add your Firebase Web App settings to firebase-config.js.";
    state.authLoading = false;
    render();
    return;
  }
  try {
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
    firebaseAuth = app.auth();
    firebaseDb = app.firestore();
    state.authReady = true;
    firebaseAuth.onAuthStateChanged(async user => {
      state.authLoading = false;
      if (!user) {
        if (accountUnsubscribe) { accountUnsubscribe(); accountUnsubscribe = null; }
        clearTimeout(accountSaveTimer);
        state.authUser = null;
        state.accountDataReady = false;
        state.accountLoadError = "";
        state.syncStatus = "saved";
        render();
        return;
      }
      try {
        await activateAccount(user);
      } catch (error) {
        console.error("Couldn't initialize the Firebase account.", error);
        state.accountLoadError = getAuthErrorMessage(error);
        state.syncStatus = "error";
        render();
      }
    }, error => {
      console.error("Firebase authentication state failed.", error);
      state.authLoading = false;
      state.authError = getAuthErrorMessage(error);
      render();
    });
  } catch (error) {
    console.error("Firebase initialization failed.", error);
    state.authSetupError = getAuthErrorMessage(error);
    state.authLoading = false;
    render();
  }
}

// ===== RENDER =====

    root.innerHTML = `<main class="auth-screen"><p class="auth-loading">Connecting to your account...</p></main>`;

  const totalDrinks = state.order.reduce((s,x) => s+x.qty, 0);
  const sortedKeys = Object.keys(totals).sort();
  const syncLabel = state.syncStatus === "syncing" ? "Saving..."
    : state.syncStatus === "error" ? "Sync issue"
      : "Saved to Firebase";

  root.innerHTML = `
    <div class="app">
      <header class="web-header">
        <div class="web-brand">${ICONS.coffee}<span>Breadfast Coffee</span></div>
        <div class="account-tools">
          <span class="sync-status ${state.syncStatus === "syncing" ? "syncing" : state.syncStatus === "error" ? "error" : ""}" title="${state.syncStatus === "error" ? escapeHtml(state.syncError || "Your latest changes are saved on this device, but Firebase sync needs attention.") : ""}">${syncLabel}</span>
          <span class="account-email">${escapeHtml(state.authUser.email || "")}</span>
          <button class="account-btn" onclick="signOutAccount()">Sign out</button>
        </div>
      </header>
      <div class="main-area">
        ${renderOrderPanel(totalDrinks, totals, sortedKeys)}
        ${state.cartOpen ? `<div class="cart-backdrop" onclick="toggleCart()"></div>` : ''}
        <main class="menu-area">
          <div class="tabs">
            ${cats.map((cat,i) => `<button class="tab ${i===state.activeCat?'active':''}" onclick="setCat(${i})">${ICONS[cat.icon]||ICONS.coffee} ${cat.label}</button>`).join("")}
            ${state.adminMode ? `
              <button class="admin-btn" onclick="openRawMaterials()" style="margin-left:auto">${ICONS.blend||''} Raw Materials</button>
              <button class="admin-btn" onclick="exportData()">${ICONS.download||''} Export Data</button>
              <button class="admin-btn" onclick="document.getElementById('importFileInput').click()">${ICONS.upload||''} Import Data</button>
              <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="importData(this.files[0])" />
            ` : ''}
            <button class="admin-btn ${state.adminMode?'on':''}" onclick="toggleAdmin()" style="${state.adminMode?'':'margin-left:auto'}">${ICONS.shield} ${state.adminMode?'Admin ON':'Admin'}</button>
          </div>
          <div class="search-bar">
            ${ICONS.search}
            <input class="search-input" placeholder="Search drinks..." value="${state.search}" oninput="setSearch(this.value)" />
          </div>
          <div class="drink-grid">
            ${state.adminMode ? `<button class="add-drink-btn" onclick="openAddDrink()">${ICONS.plus} Add New Drink to ${curCat.label}</button>` : ""}
            ${state.adminMode && categoryHasCustomizations(state.activeCat) ? `<button class="reset-cat-btn" style="grid-column:1/-1;text-align:left;margin:-6px 0 4px" onclick="resetCategoryDefaults(${state.activeCat})">↺ Restore default drinks in this category</button>` : ""}
            ${filtered.map(d => renderDrinkCard(d, state.activeCat)).join("")}
            ${filtered.length === 0 ? '<p class="no-results">No drinks found</p>' : ''}
          </div>
        </main>
        <button class="cart-fab" onclick="toggleCart()" aria-label="View order">
          ${ICONS.coffee}
          ${totalDrinks > 0 ? `<span class="cart-fab-badge">${totalDrinks}</span>` : ''}
        </button>
      </div>
    </div>
    ${state.modalDrink ? renderDrinkModal() : ''}
    ${state.editingDrink ? renderDrinkEditor() : ''}
    ${state.editingOrderItem ? renderOrderItemEditor() : ''}
    ${state.rawMaterialsOpen && !state.editingDrink && !state.editingOrderItem ? renderRawMaterialsModal() : ''}
  `;
}

          }).join('')}
        </div>
        <div class="op-actions">
          <button class="op-btn" onclick="newOrder()">New Order</button>
          <button class="op-btn" onclick="exportOrder()">${ICONS.download} Export</button>
          <button class="op-btn danger" onclick="clearOrder()">${ICONS.trash}</button>
        </div>
      </div>
    </aside>
  `;
}

function renderDrinkCard(d, catIndex) {
  const sizes = Object.keys(d.sizes);
  const sizeStr = sizes.length === 1 ? sizes[0] : sizes.join(' / ');
  const clean = cleanDrink(d);
  const cleanJson = JSON.stringify(clean).replace(/"/g,'&quot;');
  const baseKeyArg = d._isBase ? `'${(d._baseKey||'').replace(/'/g,"\\'")}'` : 'null';
  if (state.adminMode) {
    return `
      <div class="drink-card admin">
        <span class="drink-name">${d.name}</span>
        <span class="drink-sizes">${sizeStr}</span>
        ${d._isBase ? '<span class="rawmat-locked">default drink</span>' : ''}
        <div class="admin-actions">
          <button class="admin-edit" onclick="openEditDrink(${cleanJson}, ${catIndex}, ${baseKeyArg})">${ICONS.pencil} Edit</button>
          <button class="admin-del" onclick="deleteDrink(${catIndex}, '${d.name.replace(/'/g,"\\'")}', ${!!d._isBase}, ${baseKeyArg})">${ICONS.trash} Delete</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="drink-card" onclick="openDrink(${cleanJson})">
      ${d.note ? `<span class="drink-badge">${d.note}</span>` : ''}
      <span class="drink-name">${d.name}</span>
      <span class="drink-sizes">${sizeStr}</span>
      ${!d.milk ? '<span class="drink-nomilk">No milk</span>' : ''}
    </div>
  `;
}

function renderDrinkModal() {
  const d = state.modalDrink;
  const sizes = Object.keys(d.sizes);
  const isSingle = sizes.length === 1;
  const dm = state.drinkModal;
  const canConfirm = (d.milk ? !!dm.milk : true) && !!dm.size;
  return `
    <div class="overlay" onclick="closeDrinkModal()">
      <div class="modal pad" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <h3 class="modal-title">${d.name}</h3>
          <span class="modal-sub">${isSingle ? 'Single size • ' + sizes[0] : 'Choose options'}</span>
        </div>
        ${d.note ? `<div class="modal-prep"><span class="prep-badge">Prep: ${d.note}</span></div>` : ''}
        ${d.milk ? `
          <label class="modal-label">1. Choose Milk</label>
          <div class="milk-grid">
            ${MILK_OPTIONS.map(m => `<button class="milk-btn ${dm.milk===m?'sel':''}" onclick="setDrinkMilk('${m}')">${dm.milk===m?ICONS.check:''} ${m}</button>`).join('')}
          </div>
        ` : ''}
        ${!isSingle ? `
          <label class="modal-label">${d.milk?'2':'1'}. Choose Size</label>
          <div class="size-grid">
            ${sizes.map(s => `<button class="size-btn ${dm.size===s?'sel':''}" onclick="setDrinkSize('${s}')">${s}</button>`).join('')}
          </div>
        ` : (d.milk ? `<label class="modal-label">Size: <span style="color:var(--amber)">${sizes[0]}</span> (fixed)</label>` : '')}
        <div class="modal-foot" style="border:0;padding:0;margin-top:16px">
          <button class="btn-cancel" onclick="closeDrinkModal()">Cancel</button>
          <button class="btn-confirm" ${canConfirm?'':'disabled'} onclick="confirmAdd()">Add to Recipe</button>
        </div>
      </div>
    </div>
  `;
}

function renderDrinkEditor() {
  const st = state.editorState; const isEdit = !!state.editingDrink.drink;
  return `
    <div class="overlay" onclick="closeDrinkEditor()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3 class="modal-title">${isEdit ? 'Edit Drink' : 'Add New Drink'}</h3>
          <button class="modal-close" onclick="closeDrinkEditor()">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <label class="modal-label">Drink Name</label>
          <input class="modal-input mb" value="${st.name}" oninput="edSetName(this.value)" placeholder="e.g. Iced Caramel Macchiato" />
          <label class="modal-label">Prep Note (optional)</label>
          <input class="modal-input mb" value="${st.note}" oninput="edSetNote(this.value)" placeholder="e.g. Shaker" />
          <label class="milk-toggle">
            <input type="checkbox" ${st.hasMilk?'checked':''} onchange="edSetMilk(this.checked)" />
            <span style="font-size:14px;color:var(--text2)">Contains milk (show milk picker)</span>
          </label>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span class="modal-label">Sizes & Recipe</span>
            <button class="add-size-btn" onclick="edAddSize()">${ICONS.plus} Add Size</button>
          </div>
          ${st.sizes.map((sz, si) => `
            <div class="size-section">
              <div class="size-head">
                <input class="modal-input" style="flex:1" value="${sz.name}" oninput="edSetSizeName(${si},this.value)" placeholder="Size (e.g. 12oz)" />
                ${st.sizes.length > 1 ? `<button class="del-size-btn" onclick="edRemoveSize(${si})">${ICONS.trash}</button>` : ''}
              </div>
              ${sz.ingredients.map((ing, ii) => `
                <div class="ing-row">
                  <select class="modal-input ing-name" style="font-size:12px;padding:6px 8px" onchange="edUpdateIng(${si},${ii},0,this.value)">
                    ${materialOptionsHtml(ing[0])}
                  </select>
                  <input class="modal-input ing-amt" style="font-size:12px;padding:6px 8px" type="number" value="${ing[1]}" oninput="edUpdateIng(${si},${ii},1,this.value)" placeholder="0" />
                  <select class="modal-input ing-unit" style="font-size:12px;padding:6px 4px" onchange="edUpdateIng(${si},${ii},2,this.value)">
                    <option value="g" ${ing[2]==='g'?'selected':''}>g</option>
                    <option value="ml" ${ing[2]==='ml'?'selected':''}>ml</option>
                    <option value="pcs" ${ing[2]==='pcs'?'selected':''}>pcs</option>
                  </select>
                  ${sz.ingredients.length > 1 ? `<button class="ing-del" onclick="edRemoveIng(${si},${ii})">${ICONS.x}</button>` : ''}
                </div>
              `).join('')}
              <button class="add-ing-btn" onclick="edAddIng(${si})">${ICONS.plus} Add ingredient</button>
            </div>
          `).join('')}
          <button class="link-btn" onclick="openRawMaterials()">${ICONS.plus} Missing a raw material? Manage the list</button>
        </div>
        <div class="modal-foot">
          <button class="btn-cancel" onclick="closeDrinkEditor()">Cancel</button>
          <button class="btn-confirm" onclick="saveDrink()">${isEdit?'Save Changes':'Add Drink'}</button>
        </div>
      </div>
    </div>
    ${state.rawMaterialsOpen ? renderRawMaterialsModal() : ''}
  `;
}

function renderRawMaterialsModal() {
  const mats = state.rawMaterials;
  return `
    <div class="overlay" style="z-index:60" onclick="closeRawMaterials()">
      <div class="modal pad" onclick="event.stopPropagation()" style="max-width:420px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <h3 class="modal-title">Raw Materials</h3>
          <button class="modal-close" onclick="closeRawMaterials()">${ICONS.x}</button>
        </div>
        <p class="modal-sub" style="margin-bottom:12px">This is the shared ingredient list every drink recipe picks from — pick a material here once, and every drink that uses it will aggregate together correctly in the order totals.</p>
        <div class="rawmat-list">
          ${mats.map((m, i) => `
            <div class="rawmat-row">
              <input class="modal-input" value="${m.name}" onchange="renameRawMaterial(${i}, this.value)" ${m.name==='Milk'?'disabled':''} />
              <select class="modal-input rawmat-unit" onchange="setRawMaterialUnit(${i}, this.value)">
                <option value="g" ${m.unit==='g'?'selected':''}>g</option>
                <option value="ml" ${m.unit==='ml'?'selected':''}>ml</option>
                <option value="pcs" ${m.unit==='pcs'?'selected':''}>pcs</option>
              </select>
              <button class="ing-del" onclick="deleteRawMaterial(${i})">${ICONS.trash}</button>
            </div>
          `).join('')}
        </div>
        <div class="rawmat-add">
          <input class="modal-input" id="newMatName" placeholder="New material name" />
          <select class="modal-input rawmat-unit" id="newMatUnit">
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="pcs">pcs</option>
          </select>
          <button class="btn-confirm" style="flex:0 0 auto;padding:10px 14px" onclick="addRawMaterial(document.getElementById('newMatName').value, document.getElementById('newMatUnit').value); document.getElementById('newMatName').value='';">${ICONS.plus} Add</button>
        </div>
      </div>
    </div>
  `;
}

function renderOrderItemEditor() {
  const st = state.orderEditorState;
  return `
    <div class="overlay" onclick="closeOrderEditor()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3 class="modal-title">Edit Order Item</h3>
          <button class="modal-close" onclick="closeOrderEditor()">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
            <div><label class="modal-label">Name</label><input class="modal-input" value="${st.name}" oninput="oeSetName(this.value)" /></div>
            <div><label class="modal-label">Size</label><input class="modal-input" value="${st.size}" oninput="oeSetSize(this.value)" /></div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <label class="milk-toggle" style="margin-bottom:0">
              <input type="checkbox" ${st.hasMilk?'checked':''} onchange="oeSetHasMilk(this.checked)" />
              <span style="font-size:14px;color:var(--text2)">Milk</span>
            </label>
            ${st.hasMilk ? `<input class="modal-input" style="flex:1" value="${st.milk}" oninput="oeSetMilk(this.value)" placeholder="Milk type" />` : ''}
          </div>
          <label class="modal-label">Prep Note (optional)</label>
          <input class="modal-input mb" value="${st.note}" oninput="oeSetNote(this.value)" placeholder="e.g. Shaker" />
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span class="modal-label">Ingredients</span>
            <button class="add-size-btn" onclick="oeAddIng()">${ICONS.plus} Add</button>
          </div>
          ${st.ingredients.map((ing, i) => `
            <div class="ing-row">
              <select class="modal-input ing-name" style="font-size:12px;padding:6px 8px" onchange="oeUpdateIng(${i},0,this.value)">
                ${materialOptionsHtml(ing[0])}
              </select>
              <input class="modal-input ing-amt" style="font-size:12px;padding:6px 8px" type="number" value="${ing[1]}" oninput="oeUpdateIng(${i},1,this.value)" placeholder="0" />
              <select class="modal-input ing-unit" style="font-size:12px;padding:6px 4px" onchange="oeUpdateIng(${i},2,this.value)">
                <option value="g" ${ing[2]==='g'?'selected':''}>g</option>
                <option value="ml" ${ing[2]==='ml'?'selected':''}>ml</option>
                <option value="pcs" ${ing[2]==='pcs'?'selected':''}>pcs</option>
              </select>
              ${st.ingredients.length > 1 ? `<button class="ing-del" onclick="oeRemoveIng(${i})">${ICONS.x}</button>` : ''}
            </div>
          `).join('')}
          <button class="link-btn" onclick="openRawMaterials()">${ICONS.plus} Missing a raw material? Manage the list</button>
        </div>
        <div class="modal-foot">
          <button class="btn-cancel" onclick="closeOrderEditor()">Cancel</button>
          <button class="btn-confirm" onclick="saveOrderItem()">Save Changes</button>
        </div>
      </div>
    </div>
    ${state.rawMaterialsOpen ? renderRawMaterialsModal() : ''}
  `;
}

render();
window.addEventListener("DOMContentLoaded", initializeFirebase, { once: true });
</script>
</body>
</html>
